version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: release/v0.5.1
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    pull-request-branch-name:
      separator: '/'
    groups:
      production:
        dependency-type: production
      development:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    target-branch: release/v0.5.1
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(ci)
    pull-request-branch-name:
      separator: '/'
    groups:
      actions:
        patterns: ['*']
